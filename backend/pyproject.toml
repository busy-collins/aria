[project]
name = "aria-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai-agents",
    "openai",
    "fastapi",
    "uvicorn",
    "httpx",
    "boto3",
    "python-dotenv",
    "langsmith",
    "pydantic",
    "PyJWT",
    "mangum",
    "cryptography",
]

# ── Dev dependencies ──────────────────────────────────────
[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared", "agents"]

[tool.pytest.ini_options]
testpaths        = ["tests"]
python_files     = ["test_*.py"]
python_classes   = ["Test*"]
python_functions = ["test_*"]
asyncio_mode     = "auto"
addopts          = "-v --tb=short"